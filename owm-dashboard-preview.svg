<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>OpenWeatherMap dashboard preview (mockup with placeholder data)</title>

<rect width="960" height="560" fill="#111217"/>

<!-- Top bar -->
<rect x="0" y="0" width="960" height="40" fill="#181b1f"/>
<text x="16" y="25" font-size="14" fill="#d8d9da" font-weight="600">OpenWeatherMap Locations</text>
<rect x="700" y="8" width="130" height="24" rx="4" fill="#22252b" stroke="#33363c"/>
<text x="712" y="24" font-size="11" fill="#8e8e8e">Location: All</text>
<rect x="840" y="8" width="110" height="24" rx="4" fill="#22252b" stroke="#33363c"/>
<text x="852" y="24" font-size="11" fill="#8e8e8e">Last 24 hours</text>

<!-- Warning tiles row -->
<g>
<rect x="12" y="52" width="308" height="88" rx="4" fill="#181b1f" stroke="#2c2f36"/>
<text x="24" y="70" font-size="11" fill="#8e8e8e" font-weight="600">Freeze Warning</text>
<rect x="24" y="80" width="88" height="52" rx="3" fill="#3b6d11"/>
<text x="68" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Brookfield, WI</text>
<text x="68" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">41 °F</text>
<rect x="118" y="80" width="88" height="52" rx="3" fill="#3b6d11"/>
<text x="162" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Meadowview, KY</text>
<text x="162" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">52 °F</text>
<rect x="212" y="80" width="88" height="52" rx="3" fill="#3b6d11"/>
<text x="256" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Dunmore, NV</text>
<text x="256" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">67 °F</text>
</g>

<g>
<rect x="328" y="52" width="308" height="88" rx="4" fill="#181b1f" stroke="#2c2f36"/>
<text x="340" y="70" font-size="11" fill="#8e8e8e" font-weight="600">High Wind Warning</text>
<rect x="340" y="80" width="88" height="52" rx="3" fill="#3b6d11"/>
<text x="384" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Brookfield, WI</text>
<text x="384" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">12 mph</text>
<rect x="434" y="80" width="88" height="52" rx="3" fill="#a32d2d"/>
<text x="478" y="100" font-size="10" fill="#fcebeb" text-anchor="middle">Meadowview, KY</text>
<text x="478" y="120" font-size="15" fill="#fcebeb" font-weight="700" text-anchor="middle">43 mph</text>
<rect x="528" y="80" width="88" height="52" rx="3" fill="#3b6d11"/>
<text x="572" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Dunmore, NV</text>
<text x="572" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">8 mph</text>
</g>

<g>
<rect x="644" y="52" width="304" height="88" rx="4" fill="#181b1f" stroke="#2c2f36"/>
<text x="656" y="70" font-size="11" fill="#8e8e8e" font-weight="600">High Temperature Warning</text>
<rect x="656" y="80" width="88" height="52" rx="3" fill="#639922"/>
<text x="700" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Brookfield, WI</text>
<text x="700" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">74 °F</text>
<rect x="750" y="80" width="88" height="52" rx="3" fill="#639922"/>
<text x="794" y="100" font-size="10" fill="#eaf3de" text-anchor="middle">Meadowview, KY</text>
<text x="794" y="120" font-size="15" fill="#eaf3de" font-weight="700" text-anchor="middle">81 °F</text>
<rect x="844" y="80" width="88" height="52" rx="3" fill="#a32d2d"/>
<text x="888" y="100" font-size="10" fill="#fcebeb" text-anchor="middle">Dunmore, NV</text>
<text x="888" y="120" font-size="15" fill="#fcebeb" font-weight="700" text-anchor="middle">101 °F</text>
</g>

<!-- Severity summary table -->
<rect x="12" y="148" width="936" height="118" rx="4" fill="#181b1f" stroke="#2c2f36"/>
<text x="24" y="166" font-size="11" fill="#8e8e8e" font-weight="600">Active Severe Weather Alerts (NWS)</text>
<text x="24" y="190" font-size="11" fill="#8e8e8e">location</text>
<text x="330" y="190" font-size="11" fill="#8e8e8e">Minor</text>
<text x="500" y="190" font-size="11" fill="#8e8e8e">Moderate</text>
<text x="680" y="190" font-size="11" fill="#8e8e8e">Severe</text>
<text x="850" y="190" font-size="11" fill="#8e8e8e">Extreme</text>
<line x1="24" y1="198" x2="924" y2="198" stroke="#2c2f36"/>
<text x="24" y="222" font-size="12" fill="#d8d9da">Meadowview, KY (US)</text>
<rect x="640" y="208" width="220" height="20" fill="#a32d2d"/>
<text x="850" y="222" font-size="11" fill="#fcebeb" text-anchor="end" font-weight="700">1</text>
<line x1="24" y1="232" x2="924" y2="232" stroke="#2c2f36"/>
<text x="24" y="254" font-size="12" fill="#d8d9da">Dunmore, NV (US)</text>
<rect x="470" y="240" width="180" height="20" fill="#ba7517"/>
<text x="640" y="254" font-size="11" fill="#412402" text-anchor="end" font-weight="700">1</text>

<!-- Representative graph + map panels -->
<rect x="12" y="280" width="468" height="270" rx="4" fill="#181b1f" stroke="#2c2f36"/>
<text x="24" y="298" font-size="11" fill="#8e8e8e" font-weight="600">Temperature (actual / feels like)</text>
<polyline points="30,470 90,440 150,455 210,400 270,410 330,380 390,395 450,360" fill="none" stroke="#639922" stroke-width="2"/>
<polyline points="30,480 90,460 150,470 210,435 270,445 330,420 390,430 450,405" fill="none" stroke="#378ADD" stroke-width="2"/>
<text x="24" y="540" font-size="10" fill="#639922">— temp</text>
<text x="120" y="540" font-size="10" fill="#378ADD">— feels_like</text>

<rect x="492" y="280" width="456" height="270" rx="4" fill="#181b1f" stroke="#2c2f36"/>
<text x="504" y="298" font-size="11" fill="#8e8e8e" font-weight="600">Location Map</text>
<rect x="504" y="310" width="432" height="230" rx="4" fill="#0d1117"/>
<circle cx="600" cy="380" r="5" fill="#378ADD"/>
<circle cx="700" cy="420" r="5" fill="#378ADD"/>
<circle cx="800" cy="460" r="5" fill="#378ADD"/>
<text x="960" y="558" font-size="9" fill="#5a5c61" text-anchor="end">Mockup preview - placeholder data, not a live screenshot</text>
</svg>
