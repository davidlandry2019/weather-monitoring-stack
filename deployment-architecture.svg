<svg width="680" height="690" viewBox="0 0 680 690" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Weather monitoring deployment architecture</title>
<desc>Three external APIs feed two pollers on Poller host. The Tempest poller writes to the tempest bucket and the OpenWeatherMap poller writes to the weathermap bucket, both inside the same InfluxDB instance. Grafana on Grafana host queries each bucket separately over the network, and a user views the dashboards in a browser.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="690" fill="#ffffff"/>

<g font-family="Helvetica, Arial, sans-serif">

<rect x="40" y="40" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="130" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">WeatherFlow API</text>
<text x="130" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Station observations</text>

<rect x="250" y="40" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Nat. Weather Service</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Severe alerts</text>

<rect x="460" y="40" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">OpenWeatherMap API</text>
<text x="550" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">City weather data</text>

<line x1="130" y1="96" x2="165" y2="200" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="265" y2="200" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="365" y2="200" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="550" y1="96" x2="465" y2="200" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="40" y="140" width="600" height="240" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="166" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Poller host</text>
<text x="60" y="184" dominant-baseline="central" font-size="12" fill="#0C447C">Poller + InfluxDB host</text>

<rect x="60" y="200" width="270" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="195" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Tempest poller</text>
<text x="195" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">60s cycle</text>

<rect x="350" y="200" width="270" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="485" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">OpenWeatherMap poller</text>
<text x="485" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">5 min cycle</text>

<line x1="195" y1="256" x2="205" y2="306" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="485" y1="256" x2="475" y2="306" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="266" width="560" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="80" y="286" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">InfluxDB 2.x</text>

<rect x="80" y="306" width="250" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="205" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">tempest bucket</text>

<rect x="350" y="306" width="250" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="475" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">weathermap bucket</text>

<line x1="270" y1="500" x2="205" y2="366" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="410" y1="500" x2="475" y2="366" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="340" y="410" text-anchor="middle" font-size="12" fill="#5F5E5A">Flux queries</text>
<text x="340" y="425" text-anchor="middle" font-size="12" fill="#5F5E5A">port 8086</text>

<rect x="140" y="440" width="400" height="130" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="468" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Grafana host</text>
<text x="160" y="486" dominant-baseline="central" font-size="12" fill="#0C447C">Dashboard host</text>

<rect x="170" y="500" width="340" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Grafana</text>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Tempest + OpenWeatherMap dashboards</text>

<line x1="340" y1="626" x2="340" y2="572" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="270" y="626" width="140" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="646" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">User</text>
<text x="340" y="664" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Views in browser</text>

</g>
</svg>
