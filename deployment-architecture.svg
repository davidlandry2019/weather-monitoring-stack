<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Weather monitoring data flow</title>
<desc>Three external APIs (WeatherFlow, National Weather Service, OpenWeatherMap) feed into two poller scripts, which both write into a shared InfluxDB instance, which Grafana queries to render its dashboards.</desc>

<rect width="960" height="420" fill="#0d1117"/>

<g font-family="Helvetica, Arial, sans-serif">

<!-- Connector curves (drawn first, underneath boxes) -->
<path d="M 190,60 C 280,60 280,140 360,140" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<path d="M 190,210 C 260,210 260,140 360,140" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<path d="M 190,210 C 260,210 260,290 360,290" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<path d="M 190,360 C 280,360 280,290 360,290" fill="none" stroke="#3d4148" stroke-width="1.5"/>

<path d="M 590,140 C 650,140 650,205 700,205" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<path d="M 590,290 C 650,290 650,225 700,225" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<path d="M 800,215 C 840,215 840,215 880,215" fill="none" stroke="#3d4148" stroke-width="1.5"/>

<!-- Inline labels sitting on the curves -->
<rect x="245" y="88" width="88" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
<text x="289" y="103" font-size="10" fill="#8b949e" text-anchor="middle">Station API, 60s</text>

<rect x="215" y="163" width="98" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
<text x="264" y="178" font-size="10" fill="#8b949e" text-anchor="middle">NWS alerts, 5min</text>

<rect x="215" y="243" width="98" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
<text x="264" y="258" font-size="10" fill="#8b949e" text-anchor="middle">NWS alerts, 5min</text>

<rect x="245" y="318" width="98" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
<text x="294" y="333" font-size="10" fill="#8b949e" text-anchor="middle">Weather API, 5min</text>

<!-- Source boxes -->
<g>
<rect x="20" y="30" width="170" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="105" y="55" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">WeatherFlow API</text>
<text x="105" y="74" font-size="10" fill="#8b949e" text-anchor="middle">Station observations</text>
</g>

<g>
<rect x="20" y="180" width="170" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="105" y="205" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Nat. Weather Service</text>
<text x="105" y="224" font-size="10" fill="#8b949e" text-anchor="middle">Severe alerts</text>
</g>

<g>
<rect x="20" y="330" width="170" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="105" y="355" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">OpenWeatherMap API</text>
<text x="105" y="374" font-size="10" fill="#8b949e" text-anchor="middle">City weather data</text>
</g>

<!-- Poller scripts -->
<g>
<rect x="360" y="110" width="230" height="60" rx="6" fill="#132339" stroke="#1f4a7a" stroke-width="1"/>
<text x="475" y="135" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">tempest_poller.py</text>
<text x="475" y="154" font-size="10" fill="#7aa6d4" text-anchor="middle">systemd service, poller host</text>
</g>

<g>
<rect x="360" y="260" width="230" height="60" rx="6" fill="#132339" stroke="#1f4a7a" stroke-width="1"/>
<text x="475" y="285" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">owm_poller.py</text>
<text x="475" y="304" font-size="10" fill="#7aa6d4" text-anchor="middle">systemd service, poller host</text>
</g>

<!-- InfluxDB cylinder -->
<g>
<path d="M 630,175 A 70,14 0 0,0 770,175 L 770,255 A 70,14 0 0,1 630,255 Z" fill="#2d1f4a" stroke="#5a3fa0" stroke-width="1"/>
<ellipse cx="700" cy="175" rx="70" ry="14" fill="#2d1f4a" stroke="#5a3fa0" stroke-width="1"/>
<text x="700" y="205" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">InfluxDB</text>
<text x="700" y="222" font-size="10" fill="#a888e0" text-anchor="middle">tempest, weathermap</text>
<text x="700" y="236" font-size="10" fill="#a888e0" text-anchor="middle">buckets</text>
</g>

<!-- Grafana -->
<g>
<rect x="820" y="185" width="120" height="60" rx="6" fill="#132339" stroke="#1f4a7a" stroke-width="1"/>
<text x="880" y="210" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Grafana</text>
<text x="880" y="229" font-size="10" fill="#7aa6d4" text-anchor="middle">2 dashboards</text>
</g>

<text x="940" y="410" font-size="9" fill="#3d4148" text-anchor="end">Data flow - not a physical deployment diagram</text>

</g>
</svg>
